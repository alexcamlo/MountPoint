name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      # No signing identity on the runner, so the app is ad-hoc signed (not notarized).
      - run: ./build-app.sh
      - run: ditto -c -k --keepParent "build/Mount Point.app" MountPoint.zip
      - run: gh release create "$GITHUB_REF_NAME" MountPoint.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
